name: Package Published

on:
  registry_package:
    types: [published]

jobs:
  package-published:
    runs-on: ubuntu-latest

    steps:
      - name: Print triggering package
        run: |
          echo "Triggered by: ${{ github.event.registry_package.name }}"

      - name: Print ppm packages
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages?package_type=npm&per_page=100" \
            | python3 -c '
          import sys
          import json

          packages = json.load(sys.stdin)

          for package in packages:
              name = package["name"]

              if not name.startswith("ppm--"):
                  continue

              repo = package.get("repository")

              print(name)

              if repo:
                  print("  Repository:", repo.get("full_name", repo.get("name")))
              else:
                  print("  Repository: none")

              print()
          '
