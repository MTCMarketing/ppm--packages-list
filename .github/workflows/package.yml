name: Package Published

on:
  registry_package:
    types: [published]

jobs:
  package-published:
    runs-on: ubuntu-latest

    steps:
      - name: Print triggering package
        run: |
          echo "Triggered by: ${{ github.event.registry_package.name }}"

      - name: Print all package names
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/user/packages?package_type=npm&per_page=100" \
            | python3 -c 'import sys,json; print("\n".join(x["name"] for x in json.load(sys.stdin)))'
