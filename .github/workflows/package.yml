name: Package Published

on:
  registry_package:
    types: [published]

jobs:
  package-published:
    runs-on: ubuntu-latest

    steps:
      - name: Print triggering package
        run: |
          echo "Triggered by: ${{ github.event.registry_package.name }}"

      - name: Print ppm packages and collaborators
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          PACKAGES=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/user/packages?package_type=npm&per_page=100")

          COLLABORATORS=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/MTCMarketing/ppm--packages-list/collaborators?per_page=100")

          python3 - "$PACKAGES" "$COLLABORATORS" <<'PY'
          import json
          import sys

          packages = json.loads(sys.argv[1])
          collaborators = json.loads(sys.argv[2])

          for package in packages:
              name = package["name"]

              if not name.startswith("ppm--"):
                  continue

              print(name)

              for user in collaborators:
                  login = user["login"]
                  role = user.get("role_name", "unknown")
                  print(f"  - {login}: {role}")

              print()
          PY
