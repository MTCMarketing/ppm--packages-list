name: Update Package List

on:
  registry_package:
    types: [published]

permissions:
  contents: write
  packages: read

jobs:
  update-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print triggering package
        run: |
          echo "Triggered by: ${{ github.event.registry_package.name }}"

      - name: Generate packages.json
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages?package_type=npm&per_page=100" \
            | python3 -c '
          import sys
          import json

          packages = json.load(sys.stdin)

          names = sorted([
              package["name"]
              for package in packages
              if package["name"].startswith("ppm--")
          ])

          with open("packages.json", "w") as f:
              json.dump({"packages": names}, f, indent=2)
              f.write("\n")

          print("packages.json:")
          print(json.dumps({"packages": names}, indent=2))
          '

      - name: Commit packages.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add packages.json

          if git diff --cached --quiet; then
            echo "No package changes."
            exit 0
          fi

          git commit -m "Update packages.json"
          git push
